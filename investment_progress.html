<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投資学習・進捗ダッシュボード｜ルナ</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans JP','Yu Gothic',sans-serif;background:#f8f7fc;color:#29253a;line-height:1.7}main{max-width:1050px;margin:auto;padding:20px}header{background:white;border-bottom:1px solid #e4e0ee;padding:15px;text-align:center}header a{color:#4a4166;text-decoration:none;font-weight:800}.hero{background:linear-gradient(115deg,#fce9f4,#e6f5ef,#eee6ff);border-radius:22px;padding:25px;display:flex;gap:20px;align-items:center;justify-content:space-between}.hero h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem)}.hero img{width:105px;border-radius:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:17px;margin:20px 0}.card{--accent:#ca4b93;--soft:#fff0f8;background:white;border:2px solid var(--accent);border-radius:20px;padding:21px}.card h2{margin:0;color:var(--accent)}.card .number{font-size:1.8rem;font-weight:900}.track{height:15px;background:#e8e6ec;border-radius:20px;overflow:hidden;margin:13px 0}.fill{height:100%;background:var(--accent);width:0;transition:width .3s}.button{display:inline-block;background:var(--accent);color:white;text-decoration:none;border-radius:25px;padding:9px 17px;font-weight:800}.total{background:white;border-radius:20px;padding:20px;border:1px solid #e1dbe9}.note{font-size:.88rem;color:#615a70}.luna{display:flex;gap:12px;align-items:center;background:#f5f0ff;padding:16px;border-radius:18px}.luna img{width:72px;border-radius:14px}@media(max-width:600px){.hero img{width:70px}}</style></head><body><header><a href="index.html">← 🌸 ルナの投資学習サイトへ戻る</a></header><main><section class="hero"><div><h1>📊 投資学習・進捗ダッシュボード</h1><p>FX・株式投資・先物取引を、同じ画面で確認しよう！</p></div><img src="luna_18.webp" alt="ルナ"></section><section class="cards">
<article class="card" style="--accent:#ce468b"><h2>💗 FX編</h2><p>全10段階・190回</p><div class="number" id="fxcount">0 / 190 回</div><div class="track"><div class="fill" id="fxbar"></div></div><a class="button" href="progress.html">詳細・チェックへ →</a></article>
<article class="card" style="--accent:#087f69"><h2>💚 株式投資編</h2><p>全6段階・60回</p><div class="number" id="stockcount">0 / 60 回</div><div class="track"><div class="fill" id="stockbar"></div></div><p><button type="button" onclick="resetProgress('stock')" style="border:1px solid #b8aeca;border-radius:18px;padding:5px 12px;background:white;cursor:pointer">株式投資の記録をリセット</button></p><a class="button" href="stock_progress.html">詳細・チェックへ →</a></article>
<article class="card" style="--accent:#6042a2"><h2>💜 先物取引編</h2><p>全6段階・60回</p><div class="number" id="futurescount">0 / 60 回</div><div class="track"><div class="fill" id="futuresbar"></div></div><p><button type="button" onclick="resetProgress('futures')" style="border:1px solid #b8aeca;border-radius:18px;padding:5px 12px;background:white;cursor:pointer">先物取引の記録をリセット</button></p><a class="button" href="futures_progress.html">詳細・チェックへ →</a></article></section>
<section class="total"><h2>🏆 3分野の合計</h2><div class="number" id="totalcount" style="font-size:1.9rem;font-weight:900">0 / 310 回</div><div class="track"><div class="fill" id="totalbar" style="background:linear-gradient(90deg,#ce468b,#087f69,#6042a2)"></div></div></section>
<section class="luna" style="margin-top:20px"><img src="luna_03.webp" alt="ルナ"><div><b>🌙 ルナのひとこと</b><p>学習記録は今までのまま使えるよ！ただし同じブラウザ・同じサイトで開いた場合の記録だよ。別端末との同期はないので気をつけてね。</p></div></section></main>
<script>(function(){function read(key,defaultValue){try{return JSON.parse(localStorage.getItem(key)||defaultValue)}catch(e){return JSON.parse(defaultValue)}}const fx=read('luna_fx_progress_v1','{}'),stock=read('luna_stock_progress_v1','{}'),futures=read('luna-futures-read-v1','[]');let f=0,s=0,u=0;for(let stage=1;stage<=10;stage++){for(let i=1;i<=(stage===5?10:20);i++){if(fx[stage+'-'+String(i).padStart(2,'0')]===true)f++}}for(let i=1;i<=60;i++){if(stock['stock_'+String(i).padStart(2,'0')])s++}if(Array.isArray(futures))u=new Set(futures.filter(n=>Number.isInteger(n)&&n>=1&&n<=60)).size;for(const [id,n,max] of [['fx',f,190],['stock',s,60],['futures',u,60],['total',f+s+u,310]]){document.getElementById(id+'count').textContent=n+' / '+max+' 回';document.getElementById(id+'bar').style.width=(100*n/max)+'%'}})()</script><script>function resetProgress(kind){const label=kind==='stock'?'株式投資':'先物取引';if(!confirm(label+'の学習記録をすべて消しますか？ この操作は元に戻せません。'))return;localStorage.removeItem(kind==='stock'?'luna_stock_progress_v1':'luna-futures-read-v1');location.reload()}</script></body></html>
